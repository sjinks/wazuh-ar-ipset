name: Docker Cache Benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cold:
    name: Cold (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [min, max]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-docker-action@7ec28a010822b4626af4874f9448a4b05ac6f3e5
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e
        with:
          source: .
          files: docker-bake.hcl
          set: |
            default.cache-from=type=gha,scope=benchmark-20261104-${{ matrix.mode }}
            default.cache-to=type=gha,scope=benchmark-20261104-${{ matrix.mode }},mode=${{ matrix.mode }}

  warm:
    name: Warm (${{ matrix.mode }})
    needs: cold
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [min, max]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-docker-action@7ec28a010822b4626af4874f9448a4b05ac6f3e5
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e
        with:
          source: .
          files: docker-bake.hcl
          set: |
            default.cache-from=type=gha,scope=benchmark-20261104-${{ matrix.mode }}
            default.cache-to=type=gha,scope=benchmark-20261104-${{ matrix.mode }},mode=${{ matrix.mode }}

  source_change:
    name: Source change (${{ matrix.mode }})
    needs: warm
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [min, max]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-docker-action@7ec28a010822b4626af4874f9448a4b05ac6f3e5
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Change source
        run: printf '\n/* Cache benchmark source change. */\n' >> src/main.c
      - name: Build
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e
        with:
          source: .
          files: docker-bake.hcl
          set: |
            default.cache-from=type=gha,scope=benchmark-20261104-${{ matrix.mode }}
            default.cache-to=type=gha,scope=benchmark-20261104-${{ matrix.mode }},mode=${{ matrix.mode }}
